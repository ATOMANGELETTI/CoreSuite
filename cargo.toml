[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/shell",
  "crates/cli",
  "programs/editor/src-tauri",
  "programs/explorer/src-tauri",
  "programs/terminal/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
tauri = "2.11.5"
tauri-build = "2.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
coresuite-core = { path = "crates/core" }
coresuite-shell = { path = "crates/shell" }
