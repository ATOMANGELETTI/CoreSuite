name: Setup CoreSuite
description: pnpm, Node 22, Rust stable, and build caches for the Windows-first Tauri monorepo

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: pnpm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          programs/editor/src-tauri -> programs/editor/src-tauri/target
          programs/explorer/src-tauri -> programs/explorer/src-tauri/target
          programs/terminal/src-tauri -> programs/terminal/src-tauri/target
